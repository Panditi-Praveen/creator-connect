# CreatorConnect full stack.
#
# Secrets are never hardcoded here — every sensitive value comes from the
# .env file (see .env.example): MYSQL_ROOT_PASSWORD, MYSQL_PASSWORD,
# APP_JWT_SECRET, OPENAI_API_KEY. Copy .env.example to .env and fill in real
# values before running `docker compose up -d --build`.
#
# Ports on the host preserve the local development ports:
#   mysql 3307:3306 | registry 8761 | gateway 8080 | auth 8081 |
#   profile 8082 | project 8083 | hiring 8084 | ai 8085
#
# Inside the compose network every service talks to its peers by service name
# (service-registry, mysql, ...) — never localhost.

services:
  mysql:
    image: mysql:8.0
    container_name: creatorconnect-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
      MYSQL_DATABASE: creatorconnect
      # Allow the application containers (which connect over TCP as root)
      # to authenticate from any host on the compose network.
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - creatorconnect-network

  service-registry:
    build: ./backend/service-registry
    container_name: creatorconnect-registry
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - creatorconnect-network

  api-gateway:
    build: ./backend/api-gateway
    container_name: creatorconnect-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    depends_on:
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - creatorconnect-network

  auth-service:
    build: ./backend/auth-service
    container_name: creatorconnect-auth
    ports:
      - "8081:8081"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - MYSQL_URL=jdbc:mysql://mysql:3306/creatorconnect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
      - APP_JWT_SECRET=${APP_JWT_SECRET:?APP_JWT_SECRET must be set in .env}
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - creatorconnect-network

  profile-service:
    build: ./backend/profile-service
    container_name: creatorconnect-profile
    ports:
      - "8082:8082"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - MYSQL_URL=jdbc:mysql://mysql:3306/creatorconnect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
      - APP_JWT_SECRET=${APP_JWT_SECRET:?APP_JWT_SECRET must be set in .env}
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - creatorconnect-network

  project-service:
    build: ./backend/project-service
    container_name: creatorconnect-project
    ports:
      - "8083:8083"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - MYSQL_URL=jdbc:mysql://mysql:3306/creatorconnect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
      - APP_JWT_SECRET=${APP_JWT_SECRET:?APP_JWT_SECRET must be set in .env}
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - creatorconnect-network

  hiring-service:
    build: ./backend/hiring-service
    container_name: creatorconnect-hiring
    ports:
      - "8084:8084"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - MYSQL_URL=jdbc:mysql://mysql:3306/creatorconnect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
      - APP_JWT_SECRET=${APP_JWT_SECRET:?APP_JWT_SECRET must be set in .env}
      # Transactional email — MAIL_ENABLED=false (default) skips sends gracefully.
      - MAIL_ENABLED=${MAIL_ENABLED:-false}
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_SMTP_AUTH=${MAIL_SMTP_AUTH:-true}
      - MAIL_STARTTLS=${MAIL_STARTTLS:-true}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-noreply@creatorconnect.app}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-CreatorConnect}
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - creatorconnect-network

  ai-service:
    build: ./backend/ai-service
    container_name: creatorconnect-ai
    ports:
      - "8085:8085"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - APP_JWT_SECRET=${APP_JWT_SECRET:?APP_JWT_SECRET must be set in .env}
      # Optional — when missing/blank the AI Service reports a clean 503
      # configuration error on /ai/discover (documented error contract).
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - creatorconnect-network

networks:
  creatorconnect-network:
    driver: bridge

volumes:
  mysql-data:
