server:
  port: 8085

spring:
  application:
    name: ai-service

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
  instance:
    hostname: localhost
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

# JWT settings — MUST mirror the Auth Service: tokens are issued by
# auth-service, so this service shares the exact same HMAC signing secret
# and validates the issuer claim ("creatorconnect-auth-service") on every
# protected request.
app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-ms: 86400000
    issuer: creatorconnect-auth-service
  ai:
    # External LLM configuration. Never commit a real key — it is read from
    # the OPENAI_API_KEY environment variable. When it is missing, /ai/status
    # still works but /ai/discover fails with a clear 503 configuration error
    # (no fake responses are ever produced).
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      url: ${OPENAI_BASE_URL:https://api.openai.com/v1/chat/completions}
    max-results: 10
    request-timeout-seconds: 60
    max-retries: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,metrics
  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    env:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

info:
  app:
    name: CreatorConnect AI Service
    description: AI-assisted talent discovery — natural-language search over freelancer profiles
    version: 1.0.0
    java-version: ${java.version}
    spring-boot-version: 3.5.16
    spring-cloud-version: 2025.0.3

logging:
  level:
    com.creatorconnect.ai: DEBUG
    com.netflix.discovery: INFO
    com.netflix.eureka: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
