server:
  port: 8082

spring:
  application:
    name: profile-service

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/creatorconnect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:root}
    password: Praveen@0417
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
  instance:
    hostname: localhost
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

# JWT settings — MUST mirror the Auth Service: tokens are issued by
# auth-service, so this service shares the exact same HMAC signing secret
# and validates the issuer claim ("creatorconnect-auth-service") on every
# protected request.
app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-ms: 86400000
    issuer: creatorconnect-auth-service
  upload:
    dir: ./uploads/profile-pictures

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html

info:
  app:
    name: CreatorConnect Profile Service
    description: Creator & freelancer profile management — create, read, update, delete
    version: 1.0.0
    java-version: ${java.version}
    spring-boot-version: 3.5.16
    spring-cloud-version: 2025.0.3

logging:
  level:
    com.creatorconnect.profile: DEBUG
    com.netflix.discovery: INFO
    com.netflix.eureka: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
